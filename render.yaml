# Blueprint de Render para la API. MySQL no existe como servicio gestionado en Render:
# usar un MySQL externo (Aiven, TiDB Cloud, etc.) y pegar la cadena en ConnectionStrings__DefaultConnection.
services:
  - type: web
    name: nutritrack-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false # se carga a mano en el dashboard (secreto)
      - key: Cors__AllowedOrigins__0
        sync: false # URL del frontend, ej. https://nutritrack.onrender.com
      - key: Database__MigrarAlIniciar
        value: "true"

  - type: web
    name: nutritrack-web
    runtime: static
    rootDir: Web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://nutritrack-api-axs6.onrender.com
    routes:
      # SPA (react-router): cualquier ruta cae en index.html
      - type: rewrite
        source: /*
        destination: /index.html
